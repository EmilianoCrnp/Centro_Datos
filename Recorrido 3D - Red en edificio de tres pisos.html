<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Edificio 3 pisos - Red 3D</title>
<style>:root{--bg:#e9eef3;--c:#0d2340;--p:#fff}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#e9eef3}}
html,body{height:100%;margin:0;background:var(--bg);font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block}
#bar{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 8px;display:flex;gap:6px;flex-wrap:wrap}

<div id="bar"></div><div id="info"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const R=new THREE.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;document.body.appendChild(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0xe9eef3);S.fog=new THREE.Fog(0xe9eef3,45,90);
const C=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,200);
S.add(new THREE.HemisphereLight(0xffffff,0x99a,.85));
const D=new THREE.DirectionalLight(0xffffff,.8);D.position.set(-10,25,25);D.castShadow=true;D.shadow.mapSize.set(2048,2048);Object.assign(D.shadow.camera,{left:-20,right:20,top:20,bottom:-20,far:80});S.add(D);
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.6,metalness:.05},o));
function B(w,h,d,x,y,z,m,p=S){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),typeof m=='number'?M(m):m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;p.add(o);return o}

function Lab(t,x,y,z,w=2.6,col='#0d2340'){const c=document.createElement('canvas');c.width=512;c.height=128;const q=c.getContext('2d');q.fillStyle=col;q.beginPath();q.roundRect(4,8,504,112,22);q.fill();q.fillStyle='#fff';q.font='bold 40px sans-serif';q.textAlign='center';const l=t.split('\n');l.forEach((s,i)=>q.fillText(s,256,l.length>1?55+i*44:80));

// terreno y estructura
B(34,.4,22,0,-.2,2,0x9aa1a8);B(21,.3,8,0,-.15,0,0xc9ced3);
const wall=M(0xeceff2),dark=M(0x59616b),H=3.6,FL=[0,3.6,7.2];

FL.slice(1).forEach(y=>B(17.6,.3,7.6,-1.4,y-.15,0,0x8d949b));

for(let f=0;f<3;f++){B(.1,1.8,5,9.95,FL[f]+2,-.8,gl);B(.1,3,2,9.95,FL[f]+1.5,2.7,M(0x2a2f36))}

const gm=M(0xb4bac0);FL.forEach(y=>y==0&&B(20,.1,8,0,.05,0,gm));
// puerta principal vidrio
B(3.6,2.6,.1,0,1.4,3.95,gl);B(.1,2.6,.1,-1.8,1.4,3.95,0x222);B(.1,2.6,.1,1.8,1.4,3.95,0x222);B(.1,2.6,.1,0,1.4,3.95,0x222);B(3.8,.2,.4,0,2.8,3.95,0x222);

function rack(x,y,z,big){const g=new THREE.Group();B(1.3,2.6,1.3,0,1.3,0,0x0c0e12,g);B(.05,2.4,1.1,.66,1.3,0,M(0x68a8ff,{transparent:true,opacity:.2}),g);
for(let i=0;i<14;i++){const c=i%3?0x1f6fe0:0x00ff7a;B(.03,.04,.9,.67,.4+i*.15,0,M(c,{emissive:c,emissiveIntensity:1.5}),g)}
g.position.set(x,y,z);S.add(g)}
const rk=-8.4;FL.forEach(y=>rack(rk,y+.1,-1.4));
Lab('Rack Piso 2\n(Switch 24 puertos)',-7,FL[2]+3.4,-1.4,2.6);Lab('Rack Piso 1\n(Switch 24 puertos)',-7,FL[1]+3.4,-1.4,2.6);Lab('Servidor\n(1U/2U)',-7,FL[0]+3.4,-1.4,2.2);
// bajada de cableado
Tube([[rk-.7,FL[2]+2.7,-2.2],[rk-.7,FL[1]+.3,-2.2],[rk-.7,FL[0]+1.5,-2.2]],.07,0x1f6fe0);
Tube([[rk-.5,FL[2]+3.1,-3.6],[-1,FL[2]+3.1,-3.6],[8,FL[2]+3.1,-3.6]],.05,0x1f6fe0);
// pisos 1 y 2: escritorios, PCs, bus
const dk=M(0xc9a97a),mon=M(0x0a1e3a,{emissive:0x2a7fff,emissiveIntensity:.9}),pcm=M(0x1f6fe0,{emissive:0x1f6fe0,emissiveIntensity:.6});
[1,2].forEach(f=>{const y=FL[f];
for(let k=0;k<5;k++){const x=-5.2+k*2.5;B(2.2,.08,1.5,x,y+.8,-2.2,dk);B(.08,.8,1.4,x-1,y+.4,-2.2,0x333);B(.08,.8,1.4,x+1,y+.4,-2.2,0x333);
for(const dx of[-.55,.55]){B(.6,.4,.05,x+dx,y+1.2,-2.4,mon);B(.1,.3,.1,x+dx,y+.97,-2.4,0x222);B(.4,.04,.15,x+dx,y+.86,-2.05,0x222);B(.5,.1,.5,x+dx,y+.55,-1.5,0x2a2f36).visible=false;B(.45,.1,.45,x+dx,y+.2,-1.5,0x2a2f36);B(.45,.9,.45,x+dx,y+.45,-1.5,M(0x303640)).visible=false}}
// bus
Tube([[rk+.8,y+.25,1.2],[8,y+.25,1.2]],.05,0x1f6fe0);
for(let i=0;i<10;i++){const x=-5.4+i*1.15;B(.5,.35,.08,x,y+.55,1.2,pcm);B(.08,.3,.08,x,y+.38,1.2,0x1a3a7a)}
Lab('10 PC (DHCP)',-1,y+3.1,-3.4,2.4,'#1f6fe0');Lab('Bus',8,y+.8,1.2,1.1,'#1f6fe0');
// impresora, planta, AP
B(.9,.5,.7,9.3,y+.9,-3,0xf2f2f2);B(.9,.7,.7,9.3,y+.35,-3,0xddd);
const ap=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,.1,24),M(0xffffff,{emissive:0xaaccff,emissiveIntensity:.5}));ap.position.set(0,y+3.45,0);S.add(ap);
for(const px of[-3.3,3.8]){B(.4,.5,.4,px,y+.3,-3.5,0x333);const l=new THREE.Mesh(new THREE.SphereGeometry(.45,12,12),M(0x3d9a4a));l.position.set(px,y+.95,-3.5);S.add(l)}
});
// HVAC mini-split en planta baja
B(1.6,.4,.3,-5,2.9,-3.7,0xffffff);Lab('20°C',-5,2.9,-3.5,.7,'#0d6a8a');
// oficina planta baja: impresora y recepcion
B(.9,.5,.7,9.3,.9,-3,0xf2f2f2);B(.9,.7,.7,9.3,.35,-3,0xddd);B(2,1,.8,5,.5,-3,0x6b727a);
// exteriores: arboles
function tree(x,z,h){B(.3,h*.4,.3,x,h*.2,z,0x5b3d22);const l=new THREE.Mesh(new THREE.SphereGeometry(h*.35,14,14),M(0x3f8a3c));l.position.set(x,h*.7,z);l.castShadow=true;S.add(l)}
tree(-12.5,3,5);tree(-14,0,6.5);tree(-12,-2,4.5);tree(13,5,4);tree(12,7,3.5);
const bar=document.getElementById('bar'),info=document.getElementById('info');
// camara y recorrido
const V=[
{n:'Vista general',p:[0,.35,34,0,5.5,0],i:'<b>Edificio de 3 niveles</b><br>Topología bus por piso · racks a la izquierda · bajada de cableado a servidor.'},
{n:'Segundo piso',p:[0,.1,16,0,8.8,0],i:'<b>Segundo Piso</b><br>• 1 rack (izquierda)<br>• 1 switch 24 puertos<br>• 10 PC (DHCP)<br>• Topología bus<br>• Canaletas blancas<br>• Conexión punto a punto al servidor'},
{n:'Primer piso',p:[0,.1,16,0,5.2,0],i:'<b>Primer Piso</b><br>• 1 rack (izquierda)<br>• 1 switch 24 puertos<br>• 10 PC (DHCP)<br>• Topología bus<br>• Canaletas blancas<br>• Conexión punto a punto al servidor'},
{n:'Planta baja',p:[-3,.1,15,-3,1.8,0],i:'<b>Planta Baja</b><br>• 1 servidor (rack 24U)<br>• Sin PCs ni equipos adicionales<br>• Conexión directa desde racks (piso 1 y 2)'},
{n:'Rack servidor',p:[-4,.2,7,-8.4,1.5,-1.4],i:'<b>Rack</b><br>1 Switch 24p · 2 Patch panel 24p · 3 Organizador · 4 UPS (solo servidor)'},
{n:'Bajada de cableado',p:[-6,.3,9,-8.9,6,-2.2],i:'<b>Bajada de cableado</b><br>Racks a servidor, punto a punto (Cat6).'}];
let sph={az:0,el:.35,r:34},tg=new THREE.Vector3(0,5.5,0),T=null,cur=0,auto=false,tmr=0;
const pos=()=>{C.position.set(tg.x+sph.r*Math.cos(sph.el)*Math.sin(sph.az),tg.y+sph.r*Math.sin(sph.el),tg.z+sph.r*Math.cos(sph.el)*Math.cos(sph.az));C.lookAt(tg)};
function go(i){cur=i;const p=V[i].p;T={az:p[0],el:p[1],r:p[2],t:new THREE.Vector3(p[3],p[4],p[5])};info.innerHTML=V[i].i;[...bar.children].forEach((b,j)=>b.classList.toggle('on',j==i))}
V.forEach((v,i)=>{const b=document.createElement('button');b.textContent=v.n;b.onclick=()=>{auto=false;ab.classList.remove('on');go(i)};bar.appendChild(b)});
const ab=document.createElement('button');ab.textContent='▶ Recorrido automático';ab.onclick=()=>{auto=!auto;ab.classList.toggle('on',auto);tmr=0;if(auto)go(0)};bar.appendChild(ab);
go(0);
let dn=false,lx=0,ly=0;R.domElement.onpointerdown=e=>{dn=true;lx=e.clientX;ly=e.clientY;T=null;auto=false;ab.classList.remove('on')};onpointerup=()=>dn=false;
onpointermove=e=>{if(!dn)return;sph.az-=(e.clientX-lx)*.006;sph.el=Math.max(-.2,Math.min(1.3,sph.el+(e.clientY-ly)*.005));lx=e.clientX;ly=e.clientY};
R.domElement.onwheel=e=>{e.preventDefault();sph.r=Math.max(3,Math.min(60,sph.r+e.deltaY*.02));T=null};
onresize=()=>{R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()};
let last=performance.now();
(function a(n){const dt=(n-last)/1000;last=n;
if(auto){tmr+=dt;if(tmr>4.5){tmr=0;go((cur+1)%V.length)}}
if(T){const k=1-Math.pow(.02,dt);sph.az+=(T.az-sph.az)*k;sph.el+=(T.el-sph.el)*k;sph.r+=(T.r-sph.r)*k;tg.lerp(T.t,k)}
pos();R.render(S,C);requestAnimationFrame(a)})(last);
</script></body></html>

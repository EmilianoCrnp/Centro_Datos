<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Edificio 3 pisos - Red 3D</title>
<style>:root{--bg:#e9eef3;--c:#0d2340;--p:#fff}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#e9eef3}}

const R=new THREE.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;document.body.appendChild(R.domElement);

function U(h,yy,k,col){const m=k?new THREE.MeshStandardMaterial({map:TX[k],roughness:.5}):M(col,{metalness:.6});const o=B(1.08,h,.7,x,y+yy,z+.1,m);const f=new THREE.Mesh(new THREE.PlaneGeometry(1.08,h*.96),m);f.position.set(x,y+yy,fz-.14);f.castShadow=false;S.add(f);return o}

U(.14,.62,0,0x555a62);U(.14,.9,'sw');U(.14,1.08,'sw');U(.12,1.25,'cm');U(.14,1.4,'pp');U(.12,1.56,'cm');U(.14,1.72,'pp');U(.12,1.88,'cm');

Tube([[x+.5,y+.9,fz-.1],[x+.58,y+.98,fz+.12],[x+.5,y+1.08,fz-.1]],.035,0xff6a00);
const dr=B(1.2,2.4,.03,x,y+1.3,z+.56,M(0x99bbdd,{transparent:true,opacity:.18,roughness:.05,metalness:.3}));dr.castShadow=false}
const rk=-8.4;FL.forEach(y=>rack(rk,y+.1,-1.4));

[1,2].forEach(f=>{const y=FL[f];
for(let k=0;k<5;k++){const x=-5.2+k*2.5;B(2.2,.08,1.5,x,y+.8,-2.2,dk);B(.08,.8,1.4,x-1,y+.4,-2.2,0x333);B(.08,.8,1.4,x+1,y+.4,-2.2,0x333);

// bus
Tube([[rk+.8,y+.25,1.2],[8,y+.25,1.2]],.05,0x1f6fe0);
for(let i=0;i<10;i++){const x=-5.4+i*1.15;B(.5,.35,.08,x,y+.55,1.2,pcm);B(.08,.3,.08,x,y+.38,1.2,0x1a3a7a)}
Lab('10 PC (DHCP)',-1,y+3.1,-3.4,2.4,'#1f6fe0');Lab('Bus',8,y+.8,1.2,1.1,'#1f6fe0');

B(.9,.5,.7,9.3,y+.9,-3,0xf2f2f2);B(.9,.7,.7,9.3,y+.35,-3,0xddd);
const ap=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,.1,24),M(0xffffff,{emissive:0xaaccff,emissiveIntensity:.5}));ap.position.set(0,y+3.45,0);S.add(ap);
for(const px of[-3.3,3.8]){B(.4,.5,.4,px,y+.3,-3.5,0x333);const l=new THREE.Mesh(new THREE.SphereGeometry(.45,12,12),M(0x3d9a4a));l.position.set(px,y+.95,-3.5);S.add(l)}
});
// HVAC mini-split en planta baja
B(1.6,.4,.3,-5,2.9,-3.7,0xffffff);Lab('20°C',-5,2.9,-3.5,.7,'#0d6a8a');
// oficina planta baja: impresora y recepcion
B(.9,.5,.7,9.3,.9,-3,0xf2f2f2);B(.9,.7,.7,9.3,.35,-3,0xddd);B(2,1,.8,5,.5,-3,0x6b727a);

// ---- detalles extra: canaletas, charola, cables, vidrio ----
const wht=M(0xf7f8fa),mesh=M(0xf2c200,{metalness:.6,roughness:.4}),gl2=M(0xaed6f5,{transparent:true,opacity:.28,roughness:.05,metalness:.2});
function charola(x0,x1,y,z){const L=x1-x0,cx=(x0+x1)/2;B(L,.04,.5,cx,y,z,M(0xf2c200,{transparent:true,opacity:.45}));B(L,.1,.03,cx,y+.05,z-.25,mesh);B(L,.1,.03,cx,y+.05,z+.25,mesh);
for(let i=0;i<L*5;i++)B(.015,.015,.5,x0+i/5,y,z,mesh);for(let k=0;k<4;k++)Tube([[x0,y+.05,z-.15+k*.1],[x1,y+.05,z-.15+k*.1]],.018,0x2f7bff)}
FL.forEach((y,f)=>{
 // canaleta blanca perimetral (doble canal) en muro trasero y lateral
 B(18.4,.22,.1,-.8,y+.55,-3.72,wht);B(18.4,.03,.12,-.8,y+.55,-3.72,0xd0d4d8);
 if(f>0){charola(-7.6,9.3,y+3.1,-3.1);B(.2,.4,.2,-1,y+3.2,-3.1,0x444).visible=false;
  B(.12,3.0,.1,rk+.9,y+1.7,-3.7,wht);// bajante blanca desde canaleta a charola
  for(let i=0;i<10;i++){const x=-5.4+i*1.15;Tube([[x,y+.55,1.2],[x,y+.4,.2],[x+.05,y+.75,-1.3],[x,y+.55,-3.6]],.014,0x2f7bff)}} // cable PC->canaleta
 // luminarias
 for(let i=-2;i<=2;i++){B(1.4,.06,.5,i*3.4,y+3.43,0,M(0xffffff,{emissive:0xfff3d0,emissiveIntensity:1}))}
});
// sillas y plantas
for(const f of[1,2])for(let k=0;k<5;k++)for(const dx of[-.55,.55]){const x=-5.2+k*2.5+dx,y=FL[f];B(.45,.08,.45,x,y+.5,-1.5,0x1c1f24);B(.4,.5,.06,x,y+.8,-1.28,0x1c1f24);B(.06,.5,.06,x,y+.25,-1.5,0x555)}
// vidrios: fachada frontal planta baja (laterales), marcos de ventanas, balaustrada de escalera
B(.06,2.8,3,-3.1,1.4,3.95,gl2).castShadow=false;B(.06,2.8,3,3.1,1.4,3.95,gl2).castShadow=false;
B(6.2,.1,.1,0,3.05,3.95,0x333);B(.1,3,.1,-4.6,1.5,3.95,0x333);B(.1,3,.1,4.6,1.5,3.95,0x333);
for(let f=0;f<3;f++){const y=FL[f];for(let k=0;k<3;k++){B(.14,.08,1.7,10,y+2.9,-3+k*1.7+.7,0x333);B(.14,.08,1.7,10,y+1.1,-3+k*1.7+.7,0x333);B(.14,1.9,.08,10,y+2,-3+k*1.7-.15,0x333)}}

Tube([[rk-.3,FL[2]+2.6,-1.9],[rk-.7,FL[2]+2.7,-2.2]],.04,0x1f6fe0);
const bar=document.getElementById('bar'),info=document.getElementById('info');
// camara y recorrido
const V=[
{n:'Vista general',p:[0,.35,34,0,5.5,0],i:'<b>Edificio de 3 niveles</b><br>Topología bus por piso · racks a la izquierda · bajada de cableado a servidor.'},
{n:'Segundo piso',p:[0,.1,16,0,8.8,0],i:'<b>Segundo Piso</b><br>• 1 rack (izquierda)<br>• 1 switch 24 puertos<br>• 10 PC (DHCP)<br>• Topología bus<br>• Canaletas blancas<br>• Conexión punto a punto al servidor'},
{n:'Primer piso',p:[0,.1,16,0,5.2,0],i:'<b>Primer Piso</b><br>• 1 rack (izquierda)<br>• 1 switch 24 puertos<br>• 10 PC (DHCP)<br>• Topología bus<br>• Canaletas blancas<br>• Conexión punto a punto al servidor'},

{n:'Rack servidor',p:[-4,.2,7,-8.4,1.5,-1.4],i:'<b>Rack</b><br>1 Switch 24p · 2 Patch panel 24p · 3 Organizador · 4 UPS (solo servidor)'},
{n:'Bajada de cableado',p:[-6,.3,9,-8.9,6,-2.2],i:'<b>Bajada de cableado</b><br>Racks a servidor, punto a punto (Cat6).'}];
let sph={az:0,el:.35,r:34},tg=new THREE.Vector3(0,5.5,0),T=null,cur=0,auto=false,tmr=0;

function go(i){cur=i;const p=V[i].p;T={az:p[0],el:p[1],r:p[2],t:new THREE.Vector3(p[3],p[4],p[5])};info.innerHTML=V[i].i;[...bar.children].forEach((b,j)=>b.classList.toggle('on',j==i))}

pos();R.render(S,C);requestAnimationFrame(a)})(last);
